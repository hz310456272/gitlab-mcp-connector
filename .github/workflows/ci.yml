name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack validation
        run: |
          output=$(npm pack --dry-run 2>&1)
          echo "$output"
          for f in dist/server.js README.md README.en.md LICENSE \
                   docs/client-compatibility.md docs/client-compatibility.en.md \
                   examples/claude-code/run-gitlab-mcp.sh; do
            echo "$output" | grep -q "$f" || { echo "FAIL: $f missing from pack"; exit 1; }
          done

      - name: Sensitive info scan
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
          npm run scan

  docker-build:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t gitlab-mcp-connector:ci .

      - name: Verify MCP server starts and exposes tools
        run: |
          output=$(printf '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci-test","version":"0.0.1"}}}\n{"jsonrpc":"2.0","method":"notifications/initialized"}\n{"jsonrpc":"2.0","method":"tools/list","id":2,"params":{}}\n' \
            | docker run -i --rm -e GITLAB_TOKEN=ci-test-token gitlab-mcp-connector:ci 2>/dev/null)
          echo "$output" | grep -q '"gitlab-mcp-connector"' || { echo "FAIL: server name not found"; exit 1; }
          tool_count=$(echo "$output" | grep -o '"gitlab_[a-z_]*"' | sort -u | wc -l)
          echo "Tools found: $tool_count"
          [ "$tool_count" -eq 16 ] || { echo "FAIL: expected 16 tools, got $tool_count"; exit 1; }
